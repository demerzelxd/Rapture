<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Rapture social preview</title>
  <desc id="desc">A dark deep-sea ink preview image for Rapture, a writing and photography site.</desc>
  <defs>
    <radialGradient id="cyanBloom" cx="20%" cy="18%" r="65%">
      <stop offset="0" stop-color="#1a8aa5" stop-opacity="0.44" />
      <stop offset="0.42" stop-color="#07141c" stop-opacity="0.24" />
      <stop offset="1" stop-color="#05070a" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="brassBloom" cx="82%" cy="14%" r="58%">
      <stop offset="0" stop-color="#b88a3b" stop-opacity="0.42" />
      <stop offset="0.5" stop-color="#241909" stop-opacity="0.14" />
      <stop offset="1" stop-color="#05070a" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="abyss" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#07141c" />
      <stop offset="0.5" stop-color="#05070a" />
      <stop offset="1" stop-color="#020406" />
    </linearGradient>
    <linearGradient id="brassLine" x1="0" x2="1">
      <stop offset="0" stop-color="#f0c46c" stop-opacity="0" />
      <stop offset="0.22" stop-color="#f0c46c" stop-opacity="0.75" />
      <stop offset="0.74" stop-color="#52d9ff" stop-opacity="0.36" />
      <stop offset="1" stop-color="#52d9ff" stop-opacity="0" />
    </linearGradient>
    <filter id="softNoise">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.032" numOctaves="3" seed="724" />
      <feColorMatrix type="saturate" values="0" />
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.12" />
      </feComponentTransfer>
    </filter>
    <filter id="inkBlur">
      <feGaussianBlur stdDeviation="18" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#abyss)" />
  <rect width="1200" height="630" fill="url(#cyanBloom)" />
  <rect width="1200" height="630" fill="url(#brassBloom)" />
  <rect width="1200" height="630" filter="url(#softNoise)" opacity="0.62" />

  <g opacity="0.2" stroke="#e8f4f7" stroke-width="1">
    <path d="M0 118H1200" />
    <path d="M0 238H1200" />
    <path d="M0 358H1200" />
    <path d="M0 478H1200" />
    <path d="M170 0V630" />
    <path d="M470 0V630" />
    <path d="M770 0V630" />
    <path d="M1070 0V630" />
  </g>

  <g filter="url(#inkBlur)" opacity="0.56">
    <path d="M760 110C850 54 988 64 1058 142C1110 200 1074 284 978 294C890 302 854 374 770 358C690 342 668 280 700 226C718 196 720 136 760 110Z" fill="#0b4050" />
    <path d="M118 472C206 398 330 410 392 492C432 544 406 608 312 616C204 626 96 600 78 548C68 516 82 494 118 472Z" fill="#2b2111" />
  </g>

  <path d="M86 108H300" stroke="url(#brassLine)" stroke-width="2" />
  <path d="M900 522H1116" stroke="url(#brassLine)" stroke-width="2" />
  <circle cx="995" cy="190" r="122" fill="none" stroke="#f0c46c" stroke-opacity="0.16" stroke-width="1" />
  <circle cx="995" cy="190" r="82" fill="none" stroke="#52d9ff" stroke-opacity="0.13" stroke-width="1" />
  <circle cx="995" cy="190" r="7" fill="#f0c46c" fill-opacity="0.64" />

  <text x="86" y="176" fill="#f0c46c" font-family="IBM Plex Mono, Consolas, monospace" font-size="18" letter-spacing="9">PRIVATE INDEX / WRITING / GALLERY</text>
  <text x="80" y="380" fill="#e8f4f7" font-family="Cormorant Garamond, Georgia, serif" font-size="184" font-weight="700" letter-spacing="0">Rapture</text>
  <text x="92" y="448" fill="#bcd9e2" font-family="Inter, Segoe UI, sans-serif" font-size="32">A deep-sea ink universe for writing and photography.</text>
  <text x="92" y="506" fill="#9fb1bd" font-family="IBM Plex Mono, Consolas, monospace" font-size="19" letter-spacing="5">INK BENEATH THE SURFACE</text>

  <g transform="translate(86 540)" fill="none" stroke="#e8f4f7" stroke-opacity="0.28">
    <rect width="214" height="38" rx="19" />
    <rect x="230" width="166" height="38" rx="19" />
    <rect x="412" width="176" height="38" rx="19" />
  </g>
  <g transform="translate(113 565)" fill="#e8f4f7" fill-opacity="0.74" font-family="IBM Plex Mono, Consolas, monospace" font-size="14" letter-spacing="4">
    <text>WRITING</text>
    <text x="230">GALLERY</text>
    <text x="412">ARCHIVE</text>
  </g>
</svg>
